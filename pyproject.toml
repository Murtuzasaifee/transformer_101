[project]
name = "annotated_transformer"
version = "0.1.0"
description = "Modular from-scratch implementation of the Transformer (Attention Is All You Need), trainable on Multi30k."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "spacy>=3.7",
    "datasets>=2.19",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "GPUtil>=1.4.0",
]

[project.optional-dependencies]
viz = [
    "pandas>=2.2",
    "altair>=5.2",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annotated_transformer"]
